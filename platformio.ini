; ============================================================================
; PlatformIO Project Configuration File
; EE4360 - Maze Solver Challenge Project 2026
; ============================================================================
;
;   pio run                     -> build firmware
;   pio run -t upload           -> flash the Arduino Mega
;   pio device monitor          -> open serial monitor (115200 baud)
;   pio test -e native          -> run hardware-independent unit tests on host
;
; ============================================================================

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
lib_deps =
    ; No third-party libraries required -- all drivers (motor, encoder,
    ; ultrasonic, line array, MPU-6050) are implemented from scratch in
    ; lib/ so the project stays fully self-contained and easy to audit
    ; during the viva.
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries
; ----------------------------------------------------------------------------
; Native test environment: compiles and runs the pure-logic modules
; (currently MazeMapper's flood-fill algorithm) on your PC, with no board
; and no hardware required. This lets you verify the maze-solving algorithm
; before ever touching the robot.
; ----------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=c++17
    -I include
    -I lib/MazeMapper
test_filter = test_maze_mapper
; Hardware-facing libraries include <Arduino.h> and cannot build on a host
; PC, so they are excluded from the native test environment.
lib_ignore =
    MotorDriver
    Encoder
    UltrasonicSensor
    LineSensorArray
    GyroMPU6050
    PIDController
    Navigator
    BridgeHandler
    RobotFSM
