; MazeSolverBot - PlatformIO Project Configuration
;
; [env:megaatmega2560]  -> real hardware build (Arduino Mega)
; [env:native]          -> host-side unit tests (e.g. MazeMapper flood-fill)

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_port = COM5
monitor_speed = 115200
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries ;Change acording to your file location
lib_deps =

